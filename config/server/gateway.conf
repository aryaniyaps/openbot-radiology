server {
    listen 192.168.178.10:80;
    server_name radiology.demo;
    return 301 https://radiology.demo$request_uri;
}
server {
    listen 192.168.178.10:443 ssl;
    server_name radiology.demo;
    ssl_certificate /opt/kauvery-hospital/tls/server.crt;
    ssl_certificate_key /opt/kauvery-hospital/tls/server.key;
    client_max_body_size 100m;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    root /opt/kauvery-hospital/portal;
    location ^~ /demos/ { try_files $uri $uri/ =404; }
    location = / { try_files /index.html =404; }
    location ^~ /cgi-bin/ { proxy_pass http://127.0.0.1:8081; }
    location ^~ /bahmni/ { proxy_pass http://127.0.0.1:8081; }
    location ^~ /bahmni_config/ { proxy_pass http://127.0.0.1:8081; }
    location ^~ /openmrs/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
    }
    location /document_images/ { proxy_pass http://127.0.0.1:8081; }
    location /patient_images/ { proxy_pass http://127.0.0.1:8081; }
    location /clinical_forms/ { proxy_pass http://127.0.0.1:8081; }
    location /patient-document/ { proxy_pass http://127.0.0.1:8083; }
    location /open-study.html { try_files $uri =404; }
    location /assets/ { proxy_pass http://127.0.0.1:8084; }
    location ~ ^/[^/]+\.(js|css|wasm|json|map|woff2?|ttf)$ { proxy_pass http://127.0.0.1:8084; }
    location /viewer/ {
        proxy_pass http://127.0.0.1:8084/;
        proxy_set_header Host $host;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
    }
    location /dicomweb/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8080/dcm4chee-arc/aets/DCM4CHEE/rs/;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/dicom+json application/json;
        sub_filter_once off;
        sub_filter "http://127.0.0.1:8080/dcm4chee-arc/aets/DCM4CHEE/rs/" "https://radiology.demo/dicomweb/";
        proxy_buffering off;
    }
}
